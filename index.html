<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 mese insieme ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>

<section class="pg on" id="lock">
  <h1>inserisci il codice</h1>
  <div class="sub"></div>
  <div class="win">
    <div class="dots" id="dots"></div>
    <div class="err" id="err"></div>
    <div class="pad" id="pad"></div>
    <div class="hint" id="hint">hint?</div>
  </div>
</section>

<section class="pg" id="stats">
  <h1>il nostro primo mese ♥</h1>
  <div class="sub">04/09/2026</div>
  <div class="grid">
    <div class="fold"><h2><span class="ic" data-i="heart"></span>insieme da</h2>
      <div class="big" id="since"></div>
      <div class="sep"></div>
      <h2><span class="ic" data-i="flower"></span>di nuovo insieme tra</h2>
      <div class="big" id="until"></div>
      <div class="sub" style="margin:6px 0 0">31/10/2026</div></div>
    <div class="fold"><h2><span class="ic" data-i="phone"></span>ore al telefono</h2>
      <div class="big" id="calls"></div>
      <div class="sub" style="margin:10px 0 0">di voce tua ^^</div></div>
    <div class="fold album" id="open"><h2><span class="ic" data-i="flower"></span>album foto</h2>
      <span class="bk" id="book"></span>
      <div class="sub" style="margin:8px 0 0">clicca per aprire!!</div></div>
    <div class="fold"><h2><span class="ic" data-i="heart"></span>distanza</h2>
      <canvas id="map" width="140" height="100"></canvas>
      <div class="km" id="km"></div></div>
  </div>
</section>

<section class="pg" id="alb">
  <div class="top"><button class="btn" id="back">◀ indietro</button><h1 style="margin:0">i nostri ricordi</h1></div>
  <div class="rope" id="rope"><div class="track" id="track"></div></div>
  <div class="tip"></div>
</section>

<script src="script.js"></script>
</body></html>
